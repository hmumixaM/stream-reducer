name: Deploy to Cloudflare

# Builds the SPA, applies D1 migrations, and deploys the Worker + pipeline
# Container to Cloudflare on every push to main (and manually via the Actions
# tab). Requires these repository secrets:
#   CLOUDFLARE_API_TOKEN   - scoped token (Workers Scripts, D1, R2, Queues,
#                            Vectorize, Workers AI, Durable Objects edit)
#   CLOUDFLARE_ACCOUNT_ID  - 6789acff6cdae2c3d5073a701c708db7
#   ORACLE_LITELLM_API_KEY - Oracle LiteLLM bearer token
#   LLM_ACCESS_CLIENT_ID / LLM_ACCESS_CLIENT_SECRET - independent Access identity
#   OPENROUTER_API_KEY     - OpenRouter Whisper key
#   RIGHTCODE_API_KEY      - RightCode Draw API key for 4K infographic generation

on:
  push:
    branches: [main]
    paths:
      - "cf/**"
      - "frontend/**"
      - "app/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. Build the SPA -> frontend/dist (served by the Worker as static assets)
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 2. Install Worker deps
      - name: Install worker deps
        working-directory: cf/worker
        run: npm ci

      - name: Validate Worker and RSS reader
        working-directory: cf/worker
        run: |
          npm run typecheck
          npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate RSS extraction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -r cf/rss/requirements.txt pytest httpx
          pytest cf/rss/test_service.py
          pytest tests/test_audio_offload.py

      # 3. Apply D1 migrations (idempotent)
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cf/worker
          command: d1 migrations apply stream_reduce --remote

      # Upload credentials with the new version. Updating a live secret first
      # would break the previous LLM endpoint during an endpoint/key migration.
      - name: Prepare atomic runtime secrets
        working-directory: cf/worker
        env:
          GEMINI_API_KEY: ${{ secrets.ORACLE_LITELLM_API_KEY }}
          LLM_ACCESS_CLIENT_ID: ${{ secrets.LLM_ACCESS_CLIENT_ID }}
          LLM_ACCESS_CLIENT_SECRET: ${{ secrets.LLM_ACCESS_CLIENT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RIGHTCODE_API_KEY: ${{ secrets.RIGHTCODE_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          AUDIO_OFFLOAD_TOKEN: ${{ secrets.AUDIO_OFFLOAD_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const names = ['GEMINI_API_KEY', 'LLM_ACCESS_CLIENT_ID', 'LLM_ACCESS_CLIENT_SECRET', 'OPENROUTER_API_KEY', 'RIGHTCODE_API_KEY', 'ADMIN_TOKEN', 'AUDIO_OFFLOAD_TOKEN'];
          for (const name of names) {
            if (!process.env[name]) throw new Error(`Missing runtime secret: ${name}`);
          }
          writeFileSync('.deploy-secrets.json', JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name]]))), {mode: 0o600});
          JS

      # 4. Deploy the Worker + Container with its matching runtime secrets.
      - name: Deploy Worker + Container
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cf/worker
          command: deploy --secrets-file .deploy-secrets.json
