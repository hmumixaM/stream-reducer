name: Deploy LiteLLM to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "xgoose-litellm/**"
      - ".github/workflows/deploy-litellm.yml"
  workflow_dispatch:

concurrency:
  group: deploy-litellm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: xgoose-litellm
        run: npm ci

      - name: Type-check
        working-directory: xgoose-litellm
        run: npx tsc --noEmit

      # The Dockerfile builds on the account's private registry.cloudflare.com
      # image, so the runner must be able to pull it.
      - name: Log in to Cloudflare registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          creds=$(curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/containers/registries/registry.cloudflare.com/credentials" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"expiration_minutes":30,"permissions":["pull"]}')
          password=$(jq -r '.result.password' <<<"$creds")
          echo "::add-mask::${password}"
          jq -r '.result.password' <<<"$creds" \
            | docker login registry.cloudflare.com -u "$(jq -r '.result.username' <<<"$creds")" --password-stdin

      - name: Prepare Oracle service credentials
        working-directory: xgoose-litellm
        env:
          ORACLE_LITELLM_API_KEY: ${{ secrets.ORACLE_LITELLM_API_KEY }}
          ORACLE_ACCESS_CLIENT_ID: ${{ secrets.LEGACY_LLM_ACCESS_CLIENT_ID }}
          ORACLE_ACCESS_CLIENT_SECRET: ${{ secrets.LEGACY_LLM_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const names = ['ORACLE_LITELLM_API_KEY', 'ORACLE_ACCESS_CLIENT_ID', 'ORACLE_ACCESS_CLIENT_SECRET'];
          for (const name of names) {
            if (!process.env[name]) throw new Error(`Missing runtime secret: ${name}`);
          }
          writeFileSync('.deploy-secrets.json', JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name]]))), {mode: 0o600});
          JS

      - name: Deploy Worker + container
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: xgoose-litellm
          command: deploy --secrets-file .deploy-secrets.json
