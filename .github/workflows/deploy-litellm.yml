name: Deploy LiteLLM to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "xgoose-litellm/**"
      - ".github/workflows/deploy-litellm.yml"
  workflow_dispatch:

concurrency:
  group: deploy-litellm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: xgoose-litellm
        run: npm ci

      - name: Type-check and test
        working-directory: xgoose-litellm
        run: |
          npm run typecheck
          npm test

      - name: Choose container rollout
        id: rollout
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          strategy=gradual
          if [ "$EVENT_NAME" = push ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            if git diff --quiet "$BEFORE_SHA" HEAD -- xgoose-litellm/Dockerfile xgoose-litellm/config.yaml xgoose-litellm/.dockerignore; then
              strategy=none
            fi
          fi
          echo "strategy=$strategy" >> "$GITHUB_OUTPUT"

      - name: Prepare Oracle service credentials
        working-directory: xgoose-litellm
        env:
          ORACLE_LITELLM_API_KEY: ${{ secrets.ORACLE_LITELLM_API_KEY }}
          ORACLE_ACCESS_CLIENT_ID: ${{ secrets.LEGACY_LLM_ACCESS_CLIENT_ID }}
          ORACLE_ACCESS_CLIENT_SECRET: ${{ secrets.LEGACY_LLM_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const names = ['ORACLE_LITELLM_API_KEY', 'ORACLE_ACCESS_CLIENT_ID', 'ORACLE_ACCESS_CLIENT_SECRET'];
          for (const name of names) {
            if (!process.env[name]) throw new Error(`Missing runtime secret: ${name}`);
          }
          writeFileSync('.deploy-secrets.json', JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name]]))), {mode: 0o600});
          JS

      - name: Deploy Worker + container
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: xgoose-litellm
          command: deploy --secrets-file .deploy-secrets.json --containers-rollout ${{ steps.rollout.outputs.strategy }}
