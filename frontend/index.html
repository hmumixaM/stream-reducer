<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        document.documentElement.classList.toggle("dark", localStorage.getItem("sr-theme") === "dark");
      } catch { /* Use the paper reading theme when storage is unavailable. */ }
      // Start session validation while the browser downloads the application.
      // The app consumes this response once; it never persists credentials.
      if (location.pathname !== "/login") {
        window.__srSessionResponse = fetch("/api/auth/me", {
          credentials: "include",
          signal: AbortSignal.timeout(12000)
        });
        window.__srSessionResponse.catch(function () {});
      }
    </script>
    <style>
      .startup { min-height: 100vh; display: grid; place-content: center; gap: 16px; text-align: center; font: 14px system-ui, sans-serif; color: #6e655c; background: #f7f5ef; }
      .startup strong { font-size: 20px; color: #29251f; }
      .startup a { color: inherit; text-underline-offset: 3px; }
      .dark .startup { background: #141210; color: #bcb2a7; }
      .dark .startup strong { color: #f5f0e9; }
    </style>
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>stream-reduce</title>
  </head>
  <body>
    <div id="root"><div class="startup" role="status"><strong>stream-reduce</strong><span>正在打开阅读空间 · Loading your reading space…</span><a href="">重新加载 / Reload</a></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
