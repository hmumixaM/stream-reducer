<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI4 2025 conference</title>
  <desc id="desc">Purple and magenta conference cover for the AI4 2025 video library.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160a38"/>
      <stop offset=".48" stop-color="#431473"/>
      <stop offset="1" stop-color="#c51d7e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".78" cy=".18" r=".7">
      <stop offset="0" stop-color="#ff83d3" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ff83d3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#fff" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <g fill="none" stroke="#fff" stroke-opacity=".22">
