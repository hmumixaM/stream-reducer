    <path d="M830 337.5h350M1005 162.5v350"/>
  </g>
  <g fill="#fff" font-family="Inter, Arial, sans-serif">
    <text x="86" y="290" font-size="92" font-weight="800" letter-spacing="-5">Ai4</text>
    <text x="86" y="382" font-size="78" font-weight="300" letter-spacing="4">2025</text>
    <text x="90" y="441" font-size="22" font-weight="600" letter-spacing="6" opacity=".82">CONFERENCE VIDEO LIBRARY</text>
  </g>
  <path d="M86 466h520" stroke="#fff" stroke-width="2" stroke-opacity=".5"/>
