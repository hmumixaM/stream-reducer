<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI4 2026 conference</title>
  <desc id="desc">Indigo and cyan conference cover for the AI4 2026 video library.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10113c"/>
      <stop offset=".5" stop-color="#38217d"/>
      <stop offset="1" stop-color="#087c9d"/>
    </linearGradient>
    <radialGradient id="glow" cx=".8" cy=".25" r=".68">
      <stop offset="0" stop-color="#62f7e9" stop-opacity=".62"/>
      <stop offset="1" stop-color="#62f7e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#fff" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>
