# Shared Oracle gateway. Provider credentials are held only by the private relay.
model_list:
  - model_name: gemini-3.8-flash
    litellm_params:
      model: openai/google/gemini-3.8-flash
      api_base: http://vertex-relay:8080/v1
      api_key: os.environ/VERTEX_RELAY_KEY
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000002
  - model_name: gemini-3.8-flash-rightcode
    litellm_params:
      model: openai/gemini-3.8-flash
      api_base: http://vertex-relay:8080/rightcode/v1
      api_key: os.environ/VERTEX_RELAY_KEY
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000002
  - model_name: gemini-3.7-flash
    litellm_params:
      model: openai/gemini-3.7-flash
      api_base: http://vertex-relay:8080/rightcode/v1
      api_key: os.environ/VERTEX_RELAY_KEY
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000002
  - model_name: gemini-3.5-flash-vertex
    litellm_params:
      model: openai/google/gemini-3.5-flash
      api_base: http://vertex-relay:8080/v1
      api_key: os.environ/VERTEX_RELAY_KEY
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.000002
  - model_name: luna
    litellm_params:
      model: openai/gpt-6-luna
      api_base: http://vertex-relay:8080/hosted/openai/v1
      api_key: os.environ/HOSTED_RELAY_KEY
      max_retries: 0
      num_retries: 0
      reasoning_effort: none
  - model_name: gpt-6.1-sol
    litellm_params:
      model: openai/gpt-6.1-sol
      api_base: http://vertex-relay:8080/hosted/openai/v1
      api_key: os.environ/HOSTED_RELAY_KEY
      max_retries: 0
      num_retries: 0
      reasoning_effort: medium
  - model_name: gpt-6.1-terra
    litellm_params:
      model: openai/gpt-6.1-terra
      api_base: http://vertex-relay:8080/hosted/openai/v1
      api_key: os.environ/HOSTED_RELAY_KEY
      max_retries: 0
      num_retries: 0
      reasoning_effort: medium
  - model_name: gpt-6-astra
    litellm_params:
      model: openai/gpt-6-astra
      api_base: http://vertex-relay:8080/hosted/openai/v1
      api_key: os.environ/HOSTED_RELAY_KEY
      max_retries: 0
      num_retries: 0
      reasoning_effort: medium
  - model_name: gpt-6.2-astra
    litellm_params:
      model: openai/gpt-6.2-astra
      api_base: http://vertex-relay:8080/hosted/openai/v1
      api_key: os.environ/HOSTED_RELAY_KEY
      max_retries: 0
      num_retries: 0
      reasoning_effort: medium
  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_base: http://vertex-relay:8080/hosted/anthropic
      api_key: os.environ/HOSTED_RELAY_KEY
      max_retries: 0
      num_retries: 0
      reasoning_effort: medium
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_base: http://vertex-relay:8080/hosted/anthropic
      api_key: os.environ/HOSTED_RELAY_KEY
      max_retries: 0
      num_retries: 0
      reasoning_effort: medium
litellm_settings:
  # A client must never override the fixed provider targets in this file.
  drop_params: true
  num_retries: 2
  request_timeout: 120
  fallbacks:
    - gemini-3.8-flash: [gemini-3.8-flash-rightcode, gemini-3.7-flash]
    - gemini-3.7-flash: [gemini-3.5-flash-vertex]
router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 2
  cooldown_time: 30
general_settings:
  allow_client_side_credentials: false
  custom_auth: gateway_auth.authenticate
  custom_auth_run_common_checks: false
  disable_spend_logs: true
  disable_error_logs: true
